version: "3.9"

services:
  # ==========================
  # 🔥 BACKEND
  # ==========================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-scholar-backend
    ports:
      - "8014:8014"
    depends_on:
      - qdrant
      - ollama
    environment:
      - PORT=8014

      # Qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=

      # MongoDB
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

      # Session
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}

      # 🔥 FIX OLLAMA → gọi nội bộ Docker
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3:8b
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:8b
      - USE_OLLAMA_EMBEDDING=true

    restart: unless-stopped
    networks:
      - neu-scholar-net

  # ==========================
  # 🔥 QDRANT
  # ==========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neu-qdrant
    platform: linux/amd64
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - neu-scholar-net

  # ==========================
  # 🔥 OLLAMA (QUAN TRỌNG NHẤT)
  # ==========================
  ollama:
    image: ollama/ollama
    container_name: neu-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - neu-scholar-net

# ==========================
# 💾 VOLUME
# ==========================
volumes:
  qdrant_data:
  ollama_data:

# ==========================
# 🌐 NETWORK
# ==========================
networks:
  neu-scholar-net:
    driver: bridge