# ===========================================
# neu-scholar-backend — Docker Compose
# ===========================================
# MongoDB: Dùng Atlas (mongodb+srv://...), không chạy local
# Usage:
#   Dev:  docker compose up
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: neu-scholar-backend
    ports:
      - "8014:8014"
    # env_file: bỏ để deploy Portainer không lỗi (Portainer không có .env).
    # Thêm biến môi trường trong Portainer Stack → Environment variables.
    environment:
      - PORT=8014
      # MongoDB Atlas — ưu tiên lấy từ .env; mặc định dùng connection string bạn đã chỉ định
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}
    volumes:
      # Hot reload: mount source code (dev only)
      - .:/app
      - /app/node_modules  # Giữ node_modules trong container, tránh overwrite
    restart: unless-stopped
