# ===========================================
# neu-scholar-backend — Docker Compose
# ===========================================
# MongoDB: Dùng Atlas (mongodb+srv://...), không chạy local
# Usage:
#   Dev (local): cp docker-compose.override.yml.example docker-compose.override.yml && docker compose up
#   Portainer:   Stack → thêm Environment variables (MONGODB_URI, OPENAI_API_KEY, v.v.)
#   Prod:        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-scholar-backend
    ports:
      - "8014:8014"
    environment:
      - PORT=8014
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - USE_REMOTE_EMBEDDING=${USE_REMOTE_EMBEDDING:-false}
    restart: unless-stopped
