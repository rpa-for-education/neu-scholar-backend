version: "3.9"

services:
  # ===========================================
  # 🧠 VECTOR DB
  # ===========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: scholar-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__WORKERS=4
    restart: unless-stopped
    networks:
      - neu-net

  # ===========================================
  # 🔄 SYNC SERVICE
  # ===========================================
  scholar-sync:
    build:
      context: ./scholar-sync
    container_name: scholar-sync

    depends_on:
      - qdrant

    working_dir: /app

    command: >
      sh -c "
      echo '⏳ Waiting for Qdrant...' &&
      until curl -s http://scholar-qdrant:6333/collections > /dev/null; do
        sleep 2;
      done &&
      echo '🚀 Start Sync...' &&
      node src/jobs/syncAllQdrant.js &&
      echo '✅ Sync DONE'
      "

    environment:
      - QDRANT_URL=http://scholar-qdrant:6333
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv_fitneu:HuyCV%4020222030@fitneu.usewryh.mongodb.net/}
      - MONGODB_DB=${MONGODB_DB:-fitneu}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: "no"
    networks:
      - neu-net

  # ===========================================
  # 🧠 BACKEND (AI / SEARCH)
  # ===========================================
  scholar-backend:
    build:
      context: ./scholar-backend
      target: production
    container_name: scholar-backend

    ports:
      - "8014:8014"

    depends_on:
      - qdrant

    working_dir: /app

    command: >
      sh -c "
      echo '⏳ Waiting for initial sync (approx)...' &&
      sleep 20 &&
      npm start
      "

    environment:
      - PORT=8014
      - NODE_ENV=production
      - QDRANT_URL=http://scholar-qdrant:6333
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv_fitneu:HuyCV%4020222030@fitneu.usewryh.mongodb.net/}
      - MONGODB_DB=${MONGODB_DB:-fitneu}
      - SESSION_SECRET=neu-secret
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:8b
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:8b
      - EMBEDDING_MODE=proxy
      - USE_OLLAMA_EMBEDDING=true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    networks:
      - neu-net

  # ===========================================
  # 📚 SCHOLAR API (CRUD + Swagger)
  # ===========================================
  scholar-api:
    build:
      context: ./scholar-api
    container_name: scholar-api

    ports:
      - "8029:8029"

    working_dir: /app

    command: >
      sh -c "
      echo '🚀 Starting Scholar API...' &&
      node server.js
      "

    environment:
      - NODE_ENV=production
      - PORT=8029
      - SERVER_URL=http://101.96.66.232:8029   # 🔥 FIX DUY NHẤT
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv_fitneu:HuyCV%4020222030@fitneu.usewryh.mongodb.net/}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

    restart: unless-stopped
    networks:
      - neu-net

  # ===========================================
  # 🌐 CRAWLER
  # ===========================================
  scholar-crawler:
    build:
      context: ./scholar-crawler
    container_name: scholar-crawler

    depends_on:
      - qdrant

    working_dir: /app

    command: >
      sh -c "
      echo '🚀 Crawler started...';
      while true; do

        echo '🌐 Crawl EasyChair...';
        node src/jobs/crawl_easychair.js || echo '⚠️ Crawl fail';

        echo '🤖 Enrich incremental...';
        node src/jobs/enrich_easychair.js || echo '⚠️ Enrich fail';

        echo '😴 Sleep 6 hours...';
        sleep 21600;

      done
      "

    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv_fitneu:HuyCV%4020222030@fitneu.usewryh.mongodb.net/}
      - MONGODB_DB=${MONGODB_DB:-fitneu}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    networks:
      - neu-net

volumes:
  qdrant_data:

networks:
  neu-net:
    driver: bridge