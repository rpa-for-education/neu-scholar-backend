# ===========================================
# neu-scholar-backend — Docker Compose
# ===========================================
# MongoDB: Dùng Atlas | LLM/Embedding: Ollama (cùng server)
# Ollama chạy trên port 11434 → OLLAMA_BASE_URL=http://host.docker.internal:11434
# Nếu backend và ollama cùng network: OLLAMA_BASE_URL=http://ollama:11434

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-scholar-backend
    ports:
      - "8014:8014"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8014
      - QDRANT_URL=${QDRANT_URL:-https://837bec8e-d4b1-4899-9625-7ac893ad796b.eu-west-1-0.aws.cloud.qdrant.io:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIn0.jwGDQ4ulcU3I7wSE0OELrjrmDqYyyYKDAFBlsgIxjME}
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:8b}
      - USE_OLLAMA_EMBEDDING=${USE_OLLAMA_EMBEDDING:-true}
    restart: unless-stopped
networks:
  neu-scholar-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.240.0/24
