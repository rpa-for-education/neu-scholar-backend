services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-scholar-backend
    ports:
      - "8014:8014"

    depends_on:
      qdrant:
        condition: service_healthy

    environment:
      - PORT=8014
      - NODE_ENV=production

      - QDRANT_URL=http://qdrant:6333

      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

      - SESSION_SECRET=neu-secret

      - OLLAMA_BASE_URL=https://research.neu.edu.vn/ollama
      - OLLAMA_MODEL=qwen3:8b
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:8b
      - EMBEDDING_MODE=proxy
      - USE_OLLAMA_EMBEDDING=true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    networks:
      - neu-net

  sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-scholar-sync

    depends_on:
      qdrant:
        condition: service_healthy

    command: >
      sh -c "
      echo '⏳ Waiting for services...' &&
      sleep 5 &&
      echo '🚀 Sync FUND...' &&
      node scripts/sync_fund_qdrant.js &&
      echo '🚀 Sync SCHOLAR...' &&
      node scripts/sync_scholar_qdrant.js &&
      echo '✅ Sync DONE'
      "

    environment:
      - QDRANT_URL=http://qdrant:6333

      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

      - OLLAMA_BASE_URL=http://10.2.13.58:11434
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:8b
      - EMBEDDING_MODE=proxy
      - USE_OLLAMA_EMBEDDING=true

    restart: "no"
    networks:
      - neu-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: neu-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped
    networks:
      - neu-net

volumes:
  qdrant_data:

networks:
  neu-net:
    driver: bridge