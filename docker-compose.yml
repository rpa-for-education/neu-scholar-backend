version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neu-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__WORKERS=4
    restart: unless-stopped
    networks:
      - neu-net

  sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-sync

    depends_on:
      - qdrant

    command: >
      sh -c "
      echo '⏳ Waiting for Qdrant...' &&
      until curl -s http://qdrant:6333/collections > /dev/null; do
        sleep 2;
      done &&
      echo '🚀 Sync ALL (fund + conference + journal)...' &&
      node scripts/syncAllQdrant.js &&
      echo '✅ Sync DONE'
      "

    environment:
      - QDRANT_URL=http://qdrant:6333

      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

      - OLLAMA_BASE_URL=http://host.docker.internal:11434

      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:8b
      - EMBEDDING_MODE=proxy
      - USE_OLLAMA_EMBEDDING=true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: "no"
    networks:
      - neu-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-scholar-backend
    ports:
      - "8014:8014"

    depends_on:
      - qdrant

    command: >
      sh -c "
      echo '⏳ Waiting for data (sync)...' &&
      sleep 20 &&
      npm start
      "

    environment:
      - PORT=8014
      - NODE_ENV=production

      - QDRANT_URL=http://qdrant:6333

      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

      - SESSION_SECRET=neu-secret

      - OLLAMA_BASE_URL=http://host.docker.internal:11434

      - OLLAMA_MODEL=qwen3:8b
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:8b

      - EMBEDDING_MODE=proxy
      - USE_OLLAMA_EMBEDDING=true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    networks:
      - neu-net

  # ===========================================
  # 🔥 NEW SERVICE: AI CRAWLER (KHÔNG ẢNH HƯỞNG GÌ KHÁC)
  # ===========================================
  crawler-ai:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: neu-crawler-ai

    depends_on:
      - qdrant

    command: >
      sh -c "
      echo '🚀 AI Crawler started...';
      while true; do

        echo '🌐 Crawl EasyChair...';
        node services/crawl_easychair_fast.js || echo '⚠️ Crawl fail';

        echo '🤖 Enrich AI (Ollama)...';
        node services/enrich_easychair_ai.js || echo '⚠️ Enrich fail';

        echo '😴 Sleep 6 hours...';
        sleep 21600;

      done
      "

    environment:
      - NODE_ENV=production

      # dùng lại Mongo của bạn
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - DB_NAME=${MONGODB_DB:-fitneu}

      # dùng lại Ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    networks:
      - neu-net

volumes:
  qdrant_data:

networks:
  neu-net:
    driver: bridge