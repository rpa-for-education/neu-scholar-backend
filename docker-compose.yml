version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neu-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

    environment:
      - QDRANT__SERVICE__WORKERS=4

    restart: unless-stopped
    networks:
      - neu-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-backend
    ports:
      - "8014:8014"

    depends_on:
      - qdrant

    environment:
      - PORT=8014
      - NODE_ENV=production

      # Qdrant
      - QDRANT_URL=http://qdrant:6333

      # Mongo
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

      # Session
      - SESSION_SECRET=neu-secret

      # 🔥 Ollama (TỐI ƯU)
      - OLLAMA_BASE_URL=http://10.2.13.58:11434
      - OLLAMA_MODEL=qwen3:4b
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:8b
      - USE_OLLAMA_EMBEDDING=true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    networks:
      - neu-net

# ❌ KHÔNG chạy sync trong compose
# 👉 chạy thủ công khi cần

volumes:
  qdrant_data:

networks:
  neu-net:
    driver: bridge