version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neu-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__WORKERS=4
    restart: unless-stopped
    networks:
      - neu-net

  sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-sync

    depends_on:
      - qdrant

    # ✅ FIX: wait Qdrant thật sự ready (không dùng sleep)
    command: >
      sh -c "
      echo '⏳ Waiting for Qdrant...' &&
      until curl -s http://qdrant:6333/collections > /dev/null; do
        sleep 2;
      done &&
      echo '🚀 Sync FUND...' &&
      node scripts/sync_fund_qdrant.js &&
      echo '🚀 Sync SCHOLAR...' &&
      node scripts/sync_scholar_qdrant.js &&
      echo '✅ Sync DONE'
      "

    environment:
      - QDRANT_URL=http://qdrant:6333

      # ✅ Mongo giữ nguyên
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

      # ✅ FIX QUAN TRỌNG: dùng host.docker.internal
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

      # (không cần nhưng giữ cũng ok)
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:8b
      - EMBEDDING_MODE=proxy
      - USE_OLLAMA_EMBEDDING=true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: "no"
    networks:
      - neu-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-scholar-backend
    ports:
      - "8014:8014"

    depends_on:
      - qdrant

    # ✅ giữ sleep cho backend (sync xong là đủ)
    command: >
      sh -c "
      echo '⏳ Waiting for data (sync)...' &&
      sleep 20 &&
      npm start
      "

    environment:
      - PORT=8014
      - NODE_ENV=production

      - QDRANT_URL=http://qdrant:6333

      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

      - SESSION_SECRET=neu-secret

      # ✅ FIX giống sync
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

      - OLLAMA_MODEL=qwen3:8b
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:8b

      - EMBEDDING_MODE=proxy
      - USE_OLLAMA_EMBEDDING=true

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    networks:
      - neu-net

volumes:
  qdrant_data:

networks:
  neu-net:
    driver: bridge