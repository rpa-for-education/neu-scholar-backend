version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-scholar-backend
    ports:
      - "8014:8014"
    depends_on:
      - qdrant

    environment:
      - PORT=8014

      # Qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=

      # MongoDB
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

      # Session
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}

      # 🔥 FIX OLLAMA (QUAN TRỌNG NHẤT)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:8b
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:8b
      - USE_OLLAMA_EMBEDDING=true

    # 🔥 KEY FIX (KHÔNG CÓ CÁI NÀY LÀ TOANG)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    networks:
      - neu-scholar-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: neu-qdrant
    platform: linux/amd64
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - neu-scholar-net

volumes:
  qdrant_data:

networks:
  neu-scholar-net:
    driver: bridge