version: "3.9"

services:
  web:
    build: .
    image: neu-scholar-backend:latest
    pull_policy: never
    container_name: nsa-agent
    ports:
      - "8014:8014"
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-fitneu}
      PORT: ${PORT:-8014}
      SESSION_SECRET: ${SESSION_SECRET:-fitsecret}
      MAX_TOPK: ${MAX_TOPK:-30}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8014/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s