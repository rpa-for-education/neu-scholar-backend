version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neu-scholar-backend
    ports:
      - "8014:8014"
    depends_on:
      - qdrant
    environment:
      - PORT=8014

      # 👉 đổi sang Qdrant local
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=   # để trống nếu local

      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://huycv:HuyCV20252026@aiagents.e0vgq4.mongodb.net}
      - MONGODB_DB=${MONGODB_DB:-fitneu}

      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}

      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:8b}
      - USE_OLLAMA_EMBEDDING=${USE_OLLAMA_EMBEDDING:-true}

    restart: unless-stopped
    networks:
      - neu-scholar-net

  # ==========================
  # 🔥 QDRANT SERVICE
  # ==========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neu-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (optional)
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - neu-scholar-net

# ==========================
# VOLUME
# ==========================
volumes:
  qdrant_data:

# ==========================
# NETWORK
# ==========================
networks:
  neu-scholar-net:
    driver: bridge